<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>FieldLink</title>
  <style>
    :root {
      --bg: #0B0D0C;
      --bg-2: #111413;
      --card: #1A1F1C;
      --card-2: #222824;
      --line: #2E3830;
      --line-2: #3A463E;
      --text: #F3F0E7;
      --muted: #A7AEA0;
      --faint: #7B8476;
      --amber: #F0B429;
      --amber-dim: rgba(240,180,41,.16);
      --olive: #8FB56E;
      --ok: #4EBA6F;
      --ok-dim: rgba(78,186,111,.16);
      --recoil: #E86A45;
      --trigger: #6BA6D6;
      --muzzle: #C7B07A;
      --danger: #E24B4B;
      --nav-h: 72px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font: "Segoe UI", "Helvetica Neue", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100dvh; overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    input, select, textarea {
      width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; font-size: 20px; color: var(--text); caret-color: var(--amber);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: var(--amber); }
    select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 14px) 50%; background-size: 8px 8px, 8px 8px; background-repeat: no-repeat; padding-right: 40px; }
    textarea { min-height: 96px; resize: vertical; line-height: 1.35; }
    label.field { display: block; margin-bottom: 16px; }
    label.field span { display: block; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .num { font-variant-numeric: tabular-nums; }

    #app { height: 100dvh; height: 100svh; display: flex; flex-direction: column; background: var(--bg); max-width: 520px; margin: 0 auto; position: relative; }
    @media (min-width: 900px) { #app { max-width: none; } }

    .status-bar { height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 22px 8px; font-size: 15px; font-weight: 650; flex-shrink: 0; }
    .status-bar .pills { display: flex; gap: 6px; align-items: center; }
    .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-dim); }
    .sb-dot.off { background: var(--faint); box-shadow: none; }

    .header { display: flex; flex-direction: column; align-items: stretch; padding: 0 20px 8px; flex-shrink: 0; gap: 2px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header-top .tools { display: flex; gap: 8px; align-items: center; }
    .wordmark { font-size: 14px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--text); }
    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    .batt { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; }
    .batt .cell { width: 24px; height: 12px; border: 1.5px solid var(--olive); border-radius: 3px; position: relative; }
    .batt .cell::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 6px; background: var(--olive); border-radius: 0 1px 1px 0; }
    .batt .cell i { display: block; height: 100%; background: var(--ok); width: var(--lvl, 84%); }
    .batt.low .cell { border-color: var(--danger); }
    .batt.low .cell i { background: var(--danger); }
    .chip { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); background: var(--amber-dim); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }

    .content { flex: 1; overflow: auto; padding: 0 20px calc(var(--nav-h) + var(--safe-b) + 16px); -webkit-overflow-scrolling: touch; }
    .content.has-fab { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 92px); }

    .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 16px; }
    .kicker { font-size: 16px; color: var(--muted); font-weight: 600; line-height: 1.3; }
    .kicker strong { color: var(--text); font-weight: 700; }

    /* Live shot */
    .hero { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 16px 10px; text-align: center; margin-bottom: 10px; }
    .hero.flash { animation: flash 620ms ease; }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(240,180,41,.55); } 100% { box-shadow: 0 0 0 18px rgba(240,180,41,0); } }
    .hero .shot-meta { font-size: 16px; color: var(--muted); font-weight: 650; margin-bottom: 2px; }
    .vel { font-size: 72px; line-height: .92; font-weight: 750; letter-spacing: -0.04em; color: var(--amber); padding: 2px 0 0; }
    .vel-unit { font-size: 22px; font-weight: 700; color: var(--amber); letter-spacing: 0; margin-left: 6px; }
    .hero-alt { margin-top: 4px; font-size: 20px; color: var(--text); font-weight: 650; }
    .hero-alt span { color: var(--muted); font-weight: 600; padding: 0 8px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 6px 8px; text-align: center; }
    .stat b { display: block; font-size: 24px; font-weight: 750; letter-spacing: -0.03em; }
    .stat em { display: block; font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

    .chart-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px 10px; margin-bottom: 10px; }
    .chart-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: var(--bg-2); border-radius: 12px; padding: 4px; margin-bottom: 8px; }
    .chart-tabs button { height: 36px; border-radius: 10px; font-size: 16px; font-weight: 700; color: var(--muted); }
    .chart-tabs button[aria-selected="true"] { background: var(--card-2); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
    .chart-title { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 4px; gap: 0; }
    .chart-title h2 { font-size: 18px; font-weight: 750; line-height: 1.2; }
    .chart-title p { font-size: 14px; color: var(--muted); font-weight: 600; }
    .chart-svg { width: 100%; height: 96px; display: block; }
    .chart-panel { display: none; }
    .chart-panel.active { display: block; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
    .metrics div { text-align: center; }
    .metrics b { display: block; font-size: 20px; font-weight: 750; }
    .metrics em { display: block; font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin-top: 1px; }

    .shots-row { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 2px; margin-bottom: 8px; }
    .shots-row button { flex: 1 1 0; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 6px; text-align: center; }
    .shots-row button.on { border-color: var(--amber); background: var(--amber-dim); }
    .shots-row b { display: block; font-size: 18px; font-weight: 750; }
    .shots-row em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    .fab-wrap { position: absolute; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b) + 10px); padding: 0 20px; pointer-events: none; max-width: 520px; margin: 0 auto; }
    .fab { pointer-events: auto; width: 100%; height: 56px; border-radius: 16px; background: var(--amber); color: #1A1404; font-size: 20px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .fab:active { transform: scale(.98); }

    /* Lists */
    .day { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 12px 0 6px; }
    .day:first-child { margin-top: 0; }
    .row { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 12px; margin-bottom: 8px; }
    .row:active { background: var(--card-2); }
    .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .row-top h3 { font-size: 20px; font-weight: 750; }
    .row-top b { font-size: 20px; font-weight: 750; color: var(--amber); }
    .row-sub { font-size: 16px; color: var(--muted); font-weight: 600; }
    .row-stats { display: flex; gap: 14px; margin-top: 10px; font-size: 16px; font-weight: 700; }
    .row-stats span { color: var(--muted); font-weight: 650; }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 20px; }

    /* Connect */
    .connect-wrap { display: flex; flex-direction: column; align-items: stretch; gap: 16px; padding-top: 8px; }
    .device { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px 20px; text-align: center; }
    .tube { width: 100%; max-width: 320px; height: 86px; margin: 8px auto 18px; }
    .conn-state { font-size: 28px; font-weight: 750; letter-spacing: -0.03em; }
    .conn-state.ok { color: var(--ok); }
    .conn-state.scan { color: var(--amber); }
    .conn-state.off { color: var(--muted); }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .kv div { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; text-align: left; }
    .kv b { display: block; font-size: 20px; font-weight: 750; }
    .kv em { display: block; font-style: normal; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; letter-spacing: .04em; text-transform: uppercase; }
    .primary, .ghost, .danger-btn { width: 100%; height: 56px; border-radius: 16px; font-size: 20px; font-weight: 800; }
    .primary { background: var(--amber); color: #1A1404; }
    .ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
    .danger-btn { background: rgba(226,75,75,.12); color: #F3B0B0; border: 1px solid rgba(226,75,75,.35); }
    .primary:active, .ghost:active, .danger-btn:active { transform: scale(.985); }
    .hint { font-size: 16px; color: var(--muted); line-height: 1.4; text-align: center; }

    /* Settings */
    .block { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; margin-bottom: 14px; }
    .block h2 { font-size: 20px; font-weight: 750; margin-bottom: 6px; }
    .block .help { font-size: 16px; color: var(--muted); line-height: 1.4; margin-bottom: 14px; }
    .seg { display: grid; gap: 6px; background: var(--bg-2); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
    .seg.two { grid-template-columns: 1fr 1fr; }
    .seg button { height: 48px; border-radius: 10px; font-size: 20px; font-weight: 700; color: var(--muted); }
    .seg button[aria-selected="true"] { background: var(--card-2); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button { width: 56px; height: 56px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); font-size: 28px; font-weight: 700; line-height: 1; }
    .stepper .val { flex: 1; text-align: center; font-size: 32px; font-weight: 750; color: var(--amber); }

    /* Form */
    .form-grid { display: block; }
    .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 20px; }
    label.field { margin-bottom: 12px; }
    .check { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 650; margin: 8px 0 18px; }
    .check input { width: 22px; height: 22px; accent-color: var(--amber); }

    /* Nav */
    .nav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding: 6px 6px var(--safe-b); display: grid; grid-template-columns: repeat(5, 1fr); background: #0E100F; border-top: 1px solid var(--line); max-width: 520px; margin: 0 auto; }
    .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 13px; font-weight: 700; letter-spacing: .01em; min-width: 0; }
    .nav button.on { color: var(--amber); }
    .nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav button.on svg { fill: var(--amber-dim); }

    @media (min-width: 900px) {
      #app { padding: 0 28px; }
      .content { padding: 0 8px calc(var(--nav-h) + var(--safe-b) + 24px); }
      .content.has-fab { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 100px); }
      .nav, .fab-wrap { max-width: none; }
      .fab-wrap { padding: 0 36px; }
      .fab { max-width: 320px; }
      .live-grid { display: grid; grid-template-columns: minmax(340px, .9fr) 1.2fr; gap: 20px; align-items: start; }
      .vel { font-size: 110px; }
      .hero { padding: 20px 20px 16px; margin-bottom: 14px; }
      .chart-svg { height: 168px; }
      .chart-card { padding: 16px; }
      .scope-frame { width: 340px; }
      .scope-summary .score b { font-size: 24px; }
      .connect-wrap { max-width: 560px; margin: 0 auto; padding-top: 24px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .form-grid .span-2 { grid-column: 1 / -1; }
      .stats { margin-bottom: 14px; }
      .stat { padding: 12px 8px 10px; }
      .stat b { font-size: 26px; }
    }


    /* Scope aim view */
    .scope-frame { width: 236px; margin: 0 auto; position: relative; }
    .scope-svg { width: 100%; height: auto; display: block; aspect-ratio: 1; }
    .scope-status { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 36px; margin: 2px 0 6px; font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 12px; padding: 6px 10px; }
    .scope-status .lamp { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
    .scope-status.green { color: #6EE38A; background: rgba(78,186,111,.14); }
    .scope-status.green .lamp { background: #3DDB6A; box-shadow: 0 0 12px 3px rgba(61,219,106,.65), 0 0 0 4px rgba(61,219,106,.18); }
    .scope-status.amber { color: #F0B429; background: rgba(240,180,41,.12); }
    .scope-status.amber .lamp { background: #F0B429; box-shadow: 0 0 12px 3px rgba(240,180,41,.55), 0 0 0 4px rgba(240,180,41,.16); }
    .scope-status.red { color: #FF7A7A; background: rgba(226,75,75,.14); }
    .scope-status.red .lamp { background: #E24B4B; box-shadow: 0 0 12px 3px rgba(226,75,75,.55), 0 0 0 4px rgba(226,75,75,.16); }
    .scope-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin: 6px 0 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .scope-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .spark-wrap { margin-top: 4px; }
    .spark-svg { width: 100%; height: 32px; display: block; }
    .spark-label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .scope-summary .score b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
    .scope-summary .score.good b { color: var(--ok); }
    .scope-summary .score.ok b { color: var(--amber); }
    .scope-summary .score.poor b { color: var(--danger); }
    .scope-summary .score em { display: block; font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .scope-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .scope-summary .score { text-align: center; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px 6px; }
    @media (max-width: 899px) {
      .live-compact .kicker,
      .live-compact .stats,
      .live-compact .shots-row,
      .live-compact .chart-title { display: none; }
      .live-compact .hero { padding: 8px 14px; margin-bottom: 8px; display: flex; flex-direction: row; align-items: baseline; justify-content: space-between; text-align: left; gap: 8px; }
      .live-compact .shot-meta { margin: 0; order: 2; font-size: 15px; }
      .live-compact .vel { font-size: 32px; padding: 0; order: 1; }
      .live-compact .hero-alt { display: none; }
      .live-compact .scope-frame { width: 208px; }
      .live-compact .scope-summary { margin-bottom: 6px; }
      .live-compact .scope-summary + .note { display: none; }
      .scope-summary .score b { font-size: 20px; }
    }

    .back { display: inline-flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; color: var(--amber); margin-bottom: 12px; padding: 6px 0; }
    .note { font-size: 16px; color: var(--muted); line-height: 1.4; margin-top: 8px; }
    .tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--olive); background: rgba(143,181,110,.12); border-radius: 999px; padding: 4px 8px; margin-left: 6px; vertical-align: 2px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
(function () {
  "use strict";

  const GRAIN_KG = 0.00006479891;
  const FPS_TO_MPS = 0.3048;
  const ENERGY_DIV = 450240;

  const ICONS = {
    connect: '<svg viewBox="0 0 24 24"><path d="M7 7.5a5 5 0 0 1 10 0v2"/><rect x="5" y="9.5" width="14" height="10" rx="2.5"/><circle cx="12" cy="14.5" r="1.4"/></svg>',
    live: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    history: '<svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M5 10h14M10 5v14"/></svg>',
    loads: '<svg viewBox="0 0 24 24"><path d="M8 4h8l1.5 4H6.5L8 4z"/><path d="M6.5 8h11v11H6.5z"/><path d="M10 12h4"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.8l1.6 1.6M17.6 15.6l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.2l1.6-1.6M17.6 8.4l1.6-1.6"/></svg>'
  };

  function gaussian() {
    let u = 0, v = 0;
    while (!u) u = Math.random();
    while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function triggerTrace(breakLbf, pressMs) {
    const pts = [];
    const start = -Math.round(pressMs);
    for (let t = start - 40; t <= 40; t += 2) {
      let y = 0.08;
      if (t < start) y = 0.06 + Math.random() * 0.04;
      else if (t < 0) {
        const p = (t - start) / (0 - start);
        const creep = p < 0.7 ? p * 0.82 : 0.82 + (p - 0.7) / 0.3 * 0.18;
        y = breakLbf * creep + (Math.random() - 0.5) * 0.06;
      } else {
        y = breakLbf * Math.exp(-t / 18) + 0.05;
      }
      pts.push({ x: t, y: Math.max(0, y) });
    }
    return pts;
  }

  function recoilTrace(peakG) {
    const pts = [];
    for (let t = -8; t <= 48; t += 1) {
      let y = 0.3 + Math.random() * 0.15;
      if (t >= 0) {
        const rise = t < 4 ? t / 4 : 1;
        const decay = t < 4 ? 1 : Math.exp(-(t - 4) / 9);
        const osc = t > 4 ? Math.cos((t - 4) / 2.2) * Math.exp(-(t - 4) / 14) * 0.22 : 0;
        y = peakG * rise * decay + peakG * osc + 0.2;
      }
      pts.push({ x: t, y: Math.max(0, y) });
    }
    return pts;
  }

  function muzzleTrace() {
    const pts = [];
    let x = 0, y = 0;
    for (let i = 0; i < 18; i++) {
      x += (Math.random() - 0.5) * 0.28;
      y += (Math.random() - 0.45) * 0.24;
      pts.push({ x, y, phase: "hold" });
    }
    const jumpX = (Math.random() - 0.5) * 0.9;
    const jumpY = 1.4 + Math.random() * 1.1;
    for (let i = 1; i <= 12; i++) {
      const p = i / 12;
      pts.push({
        x: x + jumpX * p + (Math.random() - 0.5) * 0.08,
        y: y + jumpY * p * p + (Math.random() - 0.5) * 0.08,
        phase: "jump"
      });
    }
    return pts;
  }


  const MOA_AT_100M_MM = 29.0888;
  const AIM_T0 = -2600;
  const AIM_T1 = 480;
  let playbackTimer = 0;
  let playbackGen = 0;

  function seededRng(n) {
    let a = (n >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildAim(opts) {
    const pressMs = opts.pressMs;
    const breakLbf = opts.breakLbf;
    const brokeInPause = opts.brokeInPause !== false;
    const rand = opts.seed != null ? seededRng(opts.seed) : Math.random;
    const rnd = function () { return rand() * 2 - 1; };
    let pauseStart, pauseEnd;
    if (brokeInPause) {
      pauseStart = -Math.max(pressMs + 140, 500);
      pauseEnd = 150;
    } else {
      pauseEnd = -pressMs - 200;
      pauseStart = pauseEnd - 800;
    }
    const amp = 1.85 + rand() * 0.25;
    const period = 3900;
    const pauseLen = pauseEnd - pauseStart;
    const active = period - pauseLen;
    const pressStart = -pressMs;
    const jumpX = opts.jumpX != null ? opts.jumpX : 0.55 + rand() * 0.45;
    const jumpY = opts.jumpY != null ? opts.jumpY : 2.5 + rand() * 1.1;
    const points = [];
    let x = rnd() * 0.1;
    let yJ = 0;

    function breathAt(t) {
      if (t >= pauseStart && t <= pauseEnd) {
        return { y: 0.03 * rnd(), vel: 0, inPause: true };
      }
      let tRel = t > pauseEnd ? t - pauseEnd : t - (pauseEnd - period);
      const u = ((tRel % period) + period) % period;
      if (u >= active) return { y: 0.03 * rnd(), vel: 0, inPause: true };
      const phase = Math.PI * (u / active);
      const y = amp * Math.sin(phase);
      const vel = amp * Math.cos(phase) * Math.PI / active;
      return { y: y, vel: vel, inPause: false };
    }

    for (let t = AIM_T0; t <= AIM_T1; t += 16) {
      const b = breathAt(t);
      const jAmp = b.inPause ? 0.14 : (t < pressStart - 500 ? 0.28 : 0.16);
      x += rnd() * jAmp * 0.4;
      x *= 0.88;
      yJ += rnd() * jAmp * 0.26;
      yJ *= 0.86;
      let xAim = x + b.y * 0.22;
      let yAim = b.y + yJ;
      if (t >= pressStart && t <= 0) {
        const p = (t - pressStart) / Math.max(1, pressMs);
        xAim += 0.07 * p;
        yAim += 0.04 * p;
      }
      if (t > 0) {
        const p = Math.min(1, t / 150);
        xAim += jumpX * p;
        yAim += jumpY * p * p;
      }
      let phase = "settle";
      if (t >= pressStart && t < 0) phase = "press";
      else if (t >= 0 && t < 16) phase = "break";
      else if (t >= 16) phase = "follow";
      const wobble = Math.hypot(x, yJ);
      let light = "amber";
      if (t > 16) light = "amber";
      else if (b.inPause && wobble < 0.2 && Math.abs(b.vel) < 0.0014) light = "green";
      else if (!b.inPause && (Math.abs(b.vel) > 0.0016 || wobble > 0.32)) light = "red";
      let force = 0.07;
      if (t >= pressStart && t <= 0) {
        const p = (t - pressStart) / Math.max(1, pressMs);
        const creep = p < 0.7 ? p * 0.82 : 0.82 + (p - 0.7) / 0.3 * 0.18;
        force = breakLbf * creep;
      } else if (t > 0) {
        force = breakLbf * Math.exp(-t / 18) + 0.05;
      }
      points.push({ t: t, x: xAim, y: yAim, phase: phase, inPause: b.inPause, light: light, force: force, breath: b.y, breathVel: b.vel });
    }

    const pre = points.filter(function (p) { return p.t >= -400 && p.t <= 0; });
    const mx = pre.reduce(function (a, p) { return a + p.x; }, 0) / Math.max(1, pre.length);
    const my = pre.reduce(function (a, p) { return a + p.y; }, 0) / Math.max(1, pre.length);
    const holdMoa = pre.reduce(function (m, p) { return Math.max(m, Math.hypot(p.x - mx, p.y - my)); }, 0);
    const atBreak = points.find(function (p) { return p.t >= 0; }) || points[points.length - 1];
    const inPauseAtBreak = atBreak.inPause;
    const breakMoveMoa = Math.hypot(atBreak.x - mx, atBreak.y - my);
    let score = 10 - holdMoa * 7 - (inPauseAtBreak ? 0 : 2.4) - breakMoveMoa * 4;
    score = Math.max(3.8, Math.min(9.8, score));
    return {
      points: points,
      pauseStart: pauseStart,
      pauseEnd: pauseEnd,
      brokeInPause: inPauseAtBreak,
      holdMoa: holdMoa,
      breakMoveMoa: breakMoveMoa,
      breakMoveMm: breakMoveMoa * MOA_AT_100M_MM,
      score: score,
      meanX: mx,
      meanY: my
    };
  }

  const PHASE_COLOR = { settle: "#8A9AA8", press: "#6BA6D6", break: "#F0B429", follow: "#E86A45" };

  function sampleAt(points, t) {
    if (t <= points[0].t) return points[0];
    if (t >= points[points.length - 1].t) return points[points.length - 1];
    for (let i = 1; i < points.length; i++) {
      if (points[i].t >= t) {
        const a = points[i - 1], b = points[i];
        const u = (t - a.t) / Math.max(1, b.t - a.t);
        return {
          t: t,
          x: a.x + (b.x - a.x) * u,
          y: a.y + (b.y - a.y) * u,
          phase: t >= 0 && a.t < 0 ? "break" : a.phase,
          inPause: u < 0.5 ? a.inPause : b.inPause,
          light: u < 0.5 ? a.light : b.light,
          force: a.force + (b.force - a.force) * u,
          breath: a.breath + (b.breath - a.breath) * u,
          breathVel: a.breathVel + (b.breathVel - a.breathVel) * u
        };
      }
    }
    return points[points.length - 1];
  }

  function polyline(pts, cx, cy, scale) {
    return pts.map(function (p, i) {
      const x = cx + p.x * scale;
      const y = cy - p.y * scale;
      return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }

  function scopeSvg(shot, t, overrideLight) {
    const aim = shot.aim;
    const pts = aim.points;
    const now = t == null ? pts[pts.length - 1].t : t;
    const shown = pts.filter(function (p) { return p.t <= now; });
    const cur = sampleAt(pts, now);
    if (overrideLight) cur.light = overrideLight;
    if (overrideLight && now >= 0) {
      const atBreak = pts.find(function (p) { return p.t >= 0; });
      if (atBreak) {
        cur.force = Math.max(atBreak.force, shot.breakLbf * 0.9);
        cur.breath = atBreak.breath;
        cur.inPause = atBreak.inPause;
        cur.breathVel = atBreak.breathVel;
      }
    }
    const cx = 200, cy = 212, R = 154, scale = R / 8;
    const dx = cur.x * scale, dy = -cur.y * scale;

    function milDots(axis) {
      let s = "";
      for (let m = -2; m <= 2; m++) {
        if (m === 0) continue;
        const moa = m * 3.4377;
        if (Math.abs(moa) > 7.2) continue;
        const x = axis === "h" ? cx + moa * scale : cx;
        const y = axis === "v" ? cy - moa * scale : cy;
        s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.4" fill="#F0B429"/>';
      }
      return s;
    }

    const reticle = (
      '<g transform="translate(' + dx.toFixed(1) + ' ' + dy.toFixed(1) + ')">' +
        '<line x1="' + (cx - R) + '" y1="' + cy + '" x2="' + (cx - 42) + '" y2="' + cy + '" stroke="#F0B429" stroke-width="7" stroke-linecap="butt"/>' +
        '<line x1="' + (cx + 42) + '" y1="' + cy + '" x2="' + (cx + R) + '" y2="' + cy + '" stroke="#F0B429" stroke-width="7" stroke-linecap="butt"/>' +
        '<line x1="' + cx + '" y1="' + (cy - R) + '" x2="' + cx + '" y2="' + (cy - 42) + '" stroke="#F0B429" stroke-width="7" stroke-linecap="butt"/>' +
        '<line x1="' + cx + '" y1="' + (cy + 42) + '" x2="' + cx + '" y2="' + (cy + R) + '" stroke="#F0B429" stroke-width="7" stroke-linecap="butt"/>' +
        '<line x1="' + (cx - 44) + '" y1="' + cy + '" x2="' + (cx + 44) + '" y2="' + cy + '" stroke="#F0B429" stroke-width="1.6"/>' +
        '<line x1="' + cx + '" y1="' + (cy - 44) + '" x2="' + cx + '" y2="' + (cy + 44) + '" stroke="#F0B429" stroke-width="1.6"/>' +
        milDots("h") + milDots("v") +
        '<circle cx="' + cx + '" cy="' + cy + '" r="3.2" fill="none" stroke="#F0B429" stroke-width="1.4"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="1.2" fill="#F3F0E7"/>' +
      '</g>'
    );

    const phases = ["settle", "press", "follow"];
    let traces = "";
    phases.forEach(function (ph) {
      const seg = shown.filter(function (p) { return p.phase === ph || (ph === "press" && p.phase === "break"); });
      if (seg.length > 1) {
        const d = polyline(seg, cx, cy, scale);
        traces += '<path d="' + d + '" fill="none" stroke="#0B0D0C" stroke-width="5.2" stroke-linejoin="round" stroke-linecap="round"/>';
        traces += '<path d="' + d + '" fill="none" stroke="' + PHASE_COLOR[ph] + '" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
      }
    });

    const broke = now >= 0;
    const br = pts.find(function (p) { return p.t >= 0; });
    let breakMark = "";
    if (broke && br) {
      const bx = cx + br.x * scale, by = cy - br.y * scale;
      breakMark =
        '<circle cx="' + bx.toFixed(1) + '" cy="' + by.toFixed(1) + '" r="9" fill="none" stroke="#F3F0E7" stroke-width="2.4"/>' +
        '<circle cx="' + bx.toFixed(1) + '" cy="' + by.toFixed(1) + '" r="4" fill="#F0B429"/>' +
        '<text x="' + bx.toFixed(1) + '" y="' + (by - 14).toFixed(1) + '" text-anchor="middle" fill="#F3F0E7" font-size="13" font-weight="700" font-family="Segoe UI, system-ui, sans-serif">BREAK</text>';
    }

    const light = cur.light;
    const lampCol = light === "green" ? "#3DDB6A" : light === "red" ? "#E24B4B" : "#F0B429";
    const glowCol = light === "green" ? "rgba(61,219,106,.55)" : light === "red" ? "rgba(226,75,75,.5)" : "rgba(240,180,41,.5)";

    // Force arc on the right (from -65deg to 65deg from east)
    const a0 = (-65 * Math.PI) / 180, a1 = (65 * Math.PI) / 180;
    const ar = 176;
    function pt(a) { return [cx + Math.cos(a) * ar, cy + Math.sin(a) * ar]; }
    const p0 = pt(a0), p1 = pt(a1);
    const track = "M" + p0[0].toFixed(1) + "," + p0[1].toFixed(1) + " A " + ar + " " + ar + " 0 0 1 " + p1[0].toFixed(1) + "," + p1[1].toFixed(1);
    const frac = Math.max(0.02, Math.min(1, cur.force / Math.max(0.5, shot.breakLbf * 1.05)));
    const aF = a0 + (a1 - a0) * frac;
    const pF = pt(aF);
    const fillArc = "M" + p0[0].toFixed(1) + "," + p0[1].toFixed(1) + " A " + ar + " " + ar + " 0 0 1 " + pF[0].toFixed(1) + "," + pF[1].toFixed(1);

    // Breath capsule on the left. 1 = peak inhale, 0 = pause
    const breathLevel = Math.max(0, Math.min(1, Math.abs(cur.breath) / Math.max(0.4, aim.points.reduce(function (m, p) { return Math.max(m, Math.abs(p.breath)); }, 0.4))));
    const capX = 28, capY = 118, capW = 30, capH = 188;
    const fillH = 10 + (capH - 18) * breathLevel;
    const pauseH = 28;
    const breathFillColor = cur.inPause ? "#3DDB6A" : "#8A9AA8";

    return '<svg class="scope-svg" viewBox="0 0 400 400" role="img" aria-label="Scope aim view">' +
      '<defs>' +
        '<radialGradient id="glass" cx="46%" cy="40%" r="62%">' +
          '<stop offset="0%" stop-color="#6A7A58"/>' +
          '<stop offset="55%" stop-color="#3A4A32"/>' +
          '<stop offset="100%" stop-color="#141A12"/>' +
        '</radialGradient>' +
        '<clipPath id="glassClip"><circle cx="' + cx + '" cy="' + cy + '" r="' + R + '"/></clipPath>' +
        '<filter id="lampGlow" x="-80%" y="-80%" width="260%" height="260%">' +
          '<feGaussianBlur stdDeviation="4.5" result="b"/>' +
          '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>' +
        '</filter>' +
      '</defs>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="196" fill="#161A17" stroke="#3A463E" stroke-width="6"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="182" fill="none" stroke="#2A332C" stroke-width="10"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="url(#glass)" stroke="#1C2418" stroke-width="2"/>' +
      '<g clip-path="url(#glassClip)">' +
        reticle +
        traces +
        breakMark +
      '</g>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>' +
      // light
      '<circle cx="200" cy="28" r="16" fill="#0B0D0C" stroke="#3A463E" stroke-width="2"/>' +
      '<circle cx="200" cy="28" r="11" fill="' + lampCol + '" filter="url(#lampGlow)"/>' +
      // force arc
      '<path d="' + track + '" fill="none" stroke="#2A332C" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="' + fillArc + '" fill="none" stroke="#6BA6D6" stroke-width="8" stroke-linecap="round"/>' +
      '<text x="368" y="208" text-anchor="middle" fill="#A7AEA0" font-size="11" font-weight="700" font-family="Segoe UI, system-ui, sans-serif" transform="rotate(90 368 208)">FORCE</text>' +
      (cur.force >= 0.35 ? '<text x="348" y="' + (cy + 4).toFixed(0) + '" text-anchor="end" fill="#F3F0E7" font-size="12" font-weight="700" font-family="Segoe UI, system-ui, sans-serif">' + cur.force.toFixed(1) + '</text>' : '') +
      // breath capsule
      '<rect x="' + capX + '" y="' + capY + '" width="' + capW + '" height="' + capH + '" rx="11" fill="#0B0D0C" stroke="#2A332C" stroke-width="2"/>' +
      '<rect x="' + (capX + 3) + '" y="' + (capY + capH - 6 - pauseH) + '" width="' + (capW - 6) + '" height="' + pauseH + '" rx="6" fill="rgba(61,219,106,.22)"/>' +
      '<rect x="' + (capX + 4) + '" y="' + (capY + capH - 6 - fillH).toFixed(1) + '" width="' + (capW - 8) + '" height="' + fillH.toFixed(1) + '" rx="6" fill="' + breathFillColor + '"/>' +
      '<text x="47" y="110" text-anchor="middle" fill="#A7AEA0" font-size="10" font-weight="700" font-family="Segoe UI, system-ui, sans-serif">BREATH</text>' +
      (cur.inPause ? '<text x="47" y="' + (capY + capH + 16) + '" text-anchor="middle" fill="#6EE38A" font-size="9" font-weight="800" font-family="Segoe UI, system-ui, sans-serif">PAUSE</text>' : '') +
    '</svg>';
  }

  function forceSpark(shot, t) {
    const aim = shot.aim.points;
    const now = t == null ? aim[aim.length - 1].t : t;
    const w = 320, h = 32, pad = 4;
    const t0 = -Math.max(400, shot.pressMs + 80), t1 = 80;
    const window = aim.filter(function (p) { return p.t >= t0 && p.t <= t1; });
    const yMax = Math.max(shot.breakLbf * 1.15, 4);
    function X(ms) { return pad + (ms - t0) / (t1 - t0) * (w - pad * 2); }
    function Y(v) { return h - pad - (v / yMax) * (h - pad * 2); }
    const shown = window.filter(function (p) { return p.t <= now; });
    if (shown.length < 2) {
      return '<div class="spark-wrap"><div class="spark-label">Trigger force</div><svg class="spark-svg" viewBox="0 0 ' + w + ' ' + h + '"></svg></div>';
    }
    const d = shown.map(function (p, i) { return (i ? "L" : "M") + X(p.t).toFixed(1) + "," + Y(p.force).toFixed(1); }).join(" ");
    let mark = "";
    if (now >= 0) mark = '<line x1="' + X(0).toFixed(1) + '" x2="' + X(0).toFixed(1) + '" y1="2" y2="' + (h - 2) + '" stroke="#F0B429" stroke-width="1.5" stroke-dasharray="3 3"/>';
    const pause = shot.aim;
    const px0 = X(Math.max(t0, pause.pauseStart)), px1 = X(Math.min(t1, pause.pauseEnd));
    return '<div class="spark-wrap"><div class="spark-label">Trigger force</div>' +
      '<svg class="spark-svg" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<rect x="' + px0.toFixed(1) + '" y="2" width="' + Math.max(0, px1 - px0).toFixed(1) + '" height="' + (h - 4) + '" fill="rgba(61,219,106,.14)" rx="2"/>' +
      mark +
      '<path d="' + d + '" fill="none" stroke="#6BA6D6" stroke-width="2" stroke-linejoin="round"/>' +
      '</svg></div>';
  }

  function lightLabel(light, inPause) {
    if (light === "green") return { cls: "green", text: "Pause  ·  Shoot" };
    if (light === "red") return { cls: "red", text: "Breathing  ·  Wait" };
    return { cls: "amber", text: "Settling" };
  }

  function statusFor(shot, t, revealScore) {
    if (revealScore && t >= 0) {
      return shot.aim.brokeInPause
        ? { cls: "green", text: "Broke in the pause", light: "green" }
        : { cls: "red", text: "Broke off the pause", light: "red" };
    }
    const cur = sampleAt(shot.aim.points, t);
    const lab = lightLabel(cur.light, cur.inPause);
    lab.light = cur.light;
    return lab;
  }

  function scopePanelHtml(shot, view) {
    const t = view && view.t != null ? view.t : shot.aim.points[shot.aim.points.length - 1].t;
    const showScore = !view || view.revealScore !== false;
    const lab = statusFor(shot, t, showScore);
    const ended = t >= 0 && showScore;
    let summary = "";
    if (ended) {
      const sc = shot.aim.score;
      const grade = sc >= 8.2 ? "good" : sc >= 6.5 ? "ok" : "poor";
      summary = '<div class="scope-summary" id="scope-summary">' +
        '<div class="score ' + grade + '"><b class="num">' + sc.toFixed(1) + '</b><em>Sample score</em></div>' +
        '<div class="stat"><b class="num">' + shot.aim.holdMoa.toFixed(2) + ' MOA</b><em>Hold</em></div>' +
        '<div class="stat"><b>' + (shot.aim.brokeInPause ? "Yes" : "No") + '</b><em>In the pause</em></div>' +
        '<div class="stat"><b class="num">' + shot.aim.breakMoveMoa.toFixed(2) + ' MOA</b><em>At break</em></div>' +
        '</div>' +
        '<p class="note" style="margin-top:4px;text-align:center">' + shot.aim.breakMoveMm.toFixed(0) + ' mm at 100 m  ·  sample data</p>';
    } else {
      summary = '<div class="scope-summary" id="scope-summary" hidden></div>';
    }
    return '<div class="chart-title"><h2>Aim through the scope</h2><p>Reticle is the reference  ·  sample IMU trace</p></div>' +
      '<div class="scope-status ' + lab.cls + '" id="scope-status"><span class="lamp"></span><span id="scope-status-text">' + lab.text + '</span></div>' +
      '<div class="scope-frame" id="scope-root">' + scopeSvg(shot, t, lab.light) + '</div>' +
      '<div class="scope-legend"><span><i style="background:#8A9AA8"></i>Settling</span><span><i style="background:#6BA6D6"></i>Press</span><span><i style="background:#F0B429"></i>Break</span><span><i style="background:#E86A45"></i>Follow-through</span></div>' +
      '<div id="scope-spark">' + forceSpark(shot, t) + '</div>' +
      summary;
  }

  function paintScope(shot, view) {
    const root = document.getElementById("scope-root");
    if (!root) return;
    const t = view.t;
    const lab = statusFor(shot, t, !!view.revealScore);
    root.innerHTML = scopeSvg(shot, t, lab.light);
    const st = document.getElementById("scope-status");
    const tx = document.getElementById("scope-status-text");
    if (st) { st.className = "scope-status " + lab.cls; }
    if (tx) tx.textContent = lab.text;
    const spark = document.getElementById("scope-spark");
    if (spark) spark.innerHTML = forceSpark(shot, t);
    const box = document.getElementById("scope-summary");
    if (box && view.revealScore && t >= 0) {
      const sc = shot.aim.score;
      const grade = sc >= 8.2 ? "good" : sc >= 6.5 ? "ok" : "poor";
      box.hidden = false;
      box.className = "scope-summary";
      box.innerHTML =
        '<div class="score ' + grade + '"><b class="num">' + sc.toFixed(1) + '</b><em>Sample score</em></div>' +
        '<div class="stat"><b class="num">' + shot.aim.holdMoa.toFixed(2) + ' MOA</b><em>Hold</em></div>' +
        '<div class="stat"><b>' + (shot.aim.brokeInPause ? "Yes" : "No") + '</b><em>In the pause</em></div>' +
        '<div class="stat"><b class="num">' + shot.aim.breakMoveMoa.toFixed(2) + ' MOA</b><em>At break</em></div>';
    }
  }

  function dataTimeFromWall(wallMs) {
    // 0-1800ms: t -2600 to -500
    // 1800-2800ms: t -500 to 0
    // 2800-3600ms: t 0 to 480
    if (wallMs <= 1800) return AIM_T0 + (wallMs / 1800) * ( -500 - AIM_T0);
    if (wallMs <= 2800) return -500 + ((wallMs - 1800) / 1000) * 500;
    const u = Math.min(1, (wallMs - 2800) / 800);
    return 0 + u * AIM_T1;
  }

  function cancelPlayback() {
    playbackGen += 1;
    if (playbackTimer) { cancelAnimationFrame(playbackTimer); playbackTimer = 0; }
    if (state.playback) state.playback.running = false;
  }

  function makeShot(load, fps, overrides) {
    const o = overrides || {};
    const pressMs = o.pressMs != null ? o.pressMs : Math.round(150 + Math.random() * 160);
    const breakLbf = o.breakLbf != null ? o.breakLbf : +(3.1 + Math.random() * 0.6).toFixed(2);
    const peakG = o.peakG != null ? o.peakG : +(18 + Math.random() * 8).toFixed(1);
    const brokeInPause = o.brokeInPause != null ? o.brokeInPause : Math.random() > 0.28;
    const seed = o.seed != null ? o.seed : Math.floor(Math.random() * 1e9);
    return {
      fps: Math.round(fps),
      pressMs,
      breakLbf,
      peakG,
      trigger: triggerTrace(breakLbf, pressMs),
      recoil: recoilTrace(peakG),
      muzzle: muzzleTrace(),
      aim: buildAim({ pressMs: pressMs, breakLbf: breakLbf, brokeInPause: brokeInPause, seed: seed, jumpX: o.jumpX, jumpY: o.jumpY })
    };
  }

  function statsOf(shots) {
    if (!shots.length) return { avg: 0, es: 0, sd: 0 };
    const vals = shots.map(s => s.fps);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const es = Math.max(...vals) - Math.min(...vals);
    const sd = vals.length < 2 ? 0 : Math.sqrt(vals.reduce((a, v) => a + (v - avg) ** 2, 0) / (vals.length - 1));
    return { avg, es, sd };
  }

  function energyFtlbf(fps, grain) { return grain * fps * fps / ENERGY_DIV; }
  function energyJ(fps, grain) { const v = fps * FPS_TO_MPS; return 0.5 * grain * GRAIN_KG * v * v; }

  const seedLoads = [
    { id: "l1", name: "Hill 168", cartridge: ".308 Winchester", bullet: "Sierra MatchKing HPBT", grain: 168, powder: "Varget", charge: 43.5, primer: "CCI BR2", coalIn: 2.800, notes: "Hunting zero at 200 m. Mild in a 22 in barrel.", expectedFps: 2646 },
    { id: "l2", name: "Wind 175", cartridge: ".308 Winchester", bullet: "Sierra MatchKing HPBT", grain: 175, powder: "H4895", charge: 41.0, primer: "Federal 210M", coalIn: 2.835, notes: "Heavier bullet for a windy day. Sample workup at 41.0 gr.", expectedFps: 2583 },
    { id: "l3", name: "Ridge 140", cartridge: "6.5 Creedmoor", bullet: "Hornady ELD-M", grain: 140, powder: "H4350", charge: 41.5, primer: "CCI 400", coalIn: 2.800, notes: "Usual walking load. Clocked on a cool morning.", expectedFps: 2709 }
  ];

  function seededString(id, loadId, title, dateISO, velocities, extras) {

  const seedStrings = [

    ]),

  const state = {

  const $app = document.getElementById("app");

  function loadById(id) { return state.loads.find(l => l.id === id); }
  function stringById(id) { return state.strings.find(s => s.id === id); }
  function currentString() { return stringById(state.currentStringId); }

  function fmtInt(n) { return Math.round(n).toLocaleString("en-US"); }
  function fmt1(n) { return Number(n).toFixed(1); }
  function fmt2(n) { return Number(n).toFixed(2); }

  function velParts(fps) {
    const mps = fps * FPS_TO_MPS;
    if (state.units.velocity === "mps") {
      return { big: fmt1(mps), unit: "m/s", alt: fmtInt(fps) + " fps" };
    }
    return { big: fmtInt(fps), unit: "fps", alt: fmt1(mps) + " m/s" };
  }

  function energyParts(fps, grain) {
    if (grain == null) return null;
    if (state.units.energy === "j") return fmtInt(energyJ(fps, grain)) + " J";

    return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short", year: "numeric" });
  }

  function escape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function go(route, param) {
    param = param || null;
    let hash;
    if (route === "loads" && param === "new") {
      state.route = "load-form"; state.param = "new"; hash = "#/loads/new";
    } else if (route === "loads" && param && param.indexOf("edit/") === 0) {
      state.route = "load-form"; state.param = param.slice(5); hash = "#/loads/edit/" + state.param;
    } else if (route === "load-form") {
      state.route = "load-form"; state.param = param;
      hash = (param && param !== "new") ? "#/loads/edit/" + param : "#/loads/new";
    } else if ((route === "history" && param) || route === "string") {
      state.route = "string"; state.param = param; hash = "#/history/" + param;
    } else {
      state.route = route; state.param = param;
      hash = param ? "#/" + route + "/" + param : "#/" + route;
    }
    if (location.hash !== hash) history.replaceState(null, "", hash);
    render();
  }

  function parseHash() {
    const h = (location.hash || "#/live").replace(/^#\/?/, "");
    const parts = h.split("/");
    const route = parts[0] || "live";

    state.route = route;
    state.param = rest || null;
    if (route === "loads" && rest === "new") { state.route = "load-form"; state.param = "new"; }
    if (route === "loads" && rest.indexOf("edit/") === 0) { state.route = "load-form"; state.param = rest.slice(5); }
    if (route === "history" && rest) { state.route = "string"; state.param = rest; }

  /* ---- charts ---- */
  function lineSvg(points, opts) {
    const w = 680, h = 240, padL = 56, padR = 52, padT = 14, padB = 38;
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    let x0 = opts.xMin != null ? opts.xMin : Math.min(...xs);
    let x1 = opts.xMax != null ? opts.xMax : Math.max(...xs);
    let y0 = opts.yMin != null ? opts.yMin : 0;
    let y1 = opts.yMax != null ? opts.yMax : Math.max(...ys) * 1.12 || 1;
    if (y1 === y0) y1 = y0 + 1;
    const X = x => padL + (x - x0) / (x1 - x0) * (w - padL - padR);
    const Y = y => padT + (1 - (y - y0) / (y1 - y0)) * (h - padT - padB);
    const color = opts.color || "#F0B429";
    const d = points.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ");
    const area = d + `L${X(points[points.length-1].x).toFixed(1)},${Y(y0).toFixed(1)} L${X(points[0].x).toFixed(1)},${Y(y0).toFixed(1)} Z`;
    const yTicks = 4;
    let grid = "";
    for (let i = 0; i <= yTicks; i++) {
      const val = y0 + (y1 - y0) * (i / yTicks);
      const yy = Y(val);
      grid += `<line x1="${padL}" x2="${w-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#2E3830" stroke-width="1"/>`;
      grid += `<text x="${padL-8}" y="${(yy+5).toFixed(1)}" text-anchor="end" fill="#A7AEA0" font-size="15" font-family="Segoe UI, system-ui, sans-serif">${opts.yFmt ? opts.yFmt(val) : val.toFixed(0)}</text>`;
    }
    const xTicks = opts.xTicks || [x0, 0, x1].filter((v, i, a) => a.indexOf(v) === i && v >= x0 && v <= x1);
    let xt = "";
    xTicks.forEach((val, i) => {
      const xx = X(val);
      const anchor = i === 0 ? "start" : i === xTicks.length - 1 ? "end" : "middle";
      xt += `<text x="${xx.toFixed(1)}" y="${h-10}" text-anchor="${anchor}" fill="#A7AEA0" font-size="15" font-family="Segoe UI, system-ui, sans-serif">${opts.xFmt ? opts.xFmt(val) : val}</text>`;
    });
    let mark = "";
    if (opts.markX != null && opts.markX >= x0 && opts.markX <= x1) {
      const xx = X(opts.markX);
      mark = `<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${padT}" y2="${h-padB}" stroke="#A7AEA0" stroke-dasharray="4 5" stroke-width="1.5"/>`;
    }
    const last = points[points.length - 1];
    const peak = points.reduce((a, p) => p.y > a.y ? p : a, points[0]);
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${grid}${xt}${mark}<path d="${area}" fill="${color}" fill-opacity="0.16"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(peak.x).toFixed(1)}" cy="${Y(peak.y).toFixed(1)}" r="5" fill="${color}"/></svg>`;
  }

  function muzzleSvg(points) {
    const w = 680, h = 240, padL = 48, padB = 38, padT = 14, padR = 28;
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const max = Math.max(2.4, ...xs.map(Math.abs), ...ys.map(Math.abs)) * 1.15;
    const X = x => padL + (x + max) / (2 * max) * (w - padL - padR);
    const Y = y => padT + (1 - (y + max) / (2 * max)) * (h - padT - padB);
    const d = points.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ");
    const start = points[0], end = points[points.length - 1];
    const ticks = [-Math.floor(max), 0, Math.floor(max)];
    let grid = "";
    ticks.forEach(val => {
      const xx = X(val), yy = Y(val);
      grid += `<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${padT}" y2="${h-padB}" stroke="#2E3830" stroke-width="${val===0?1.6:1}"/>`;
      grid += `<line x1="${padL}" x2="${w-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#2E3830" stroke-width="${val===0?1.6:1}"/>`;
      grid += `<text x="${xx.toFixed(1)}" y="${h-10}" text-anchor="middle" fill="#A7AEA0" font-size="15" font-family="Segoe UI, system-ui, sans-serif">${val} mm</text>`;
      if (val !== 0) grid += `<text x="${padL-8}" y="${(yy+5).toFixed(1)}" text-anchor="end" fill="#A7AEA0" font-size="15" font-family="Segoe UI, system-ui, sans-serif">${val}</text>`;
    });
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${grid}<path d="${d}" fill="none" stroke="#C7B07A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(start.x).toFixed(1)}" cy="${Y(start.y).toFixed(1)}" r="6" fill="#8FB56E"/><circle cx="${X(end.x).toFixed(1)}" cy="${Y(end.y).toFixed(1)}" r="6" fill="#E86A45"/></svg>`;
  }

  function holdAndJump(points) {
    const hold = points.filter(p => p.phase === "hold");
    const jump = points[points.length - 1];
    const holdR = hold.reduce((m, p) => Math.max(m, Math.hypot(p.x, p.y)), 0);
    const jumpR = Math.hypot(jump.x, jump.y);
    return { holdR, jumpR };
  }

                <div><b class="num">${shot.pressMs} ms</b><em>Press time</em></div>
              </div>
            </div>

        </div>`;
    }

    const dis = state.connected ? "" : `<p class="hint" style="margin-bottom:12px">Module is off-link. Traces below are still sample data — use Simulate shot to preview a live update.</p>`;

    return `

            </div>
            <div class="stats">
              <div class="stat"><b class="num">${shots.length ? (state.units.velocity==="mps"?fmt1(st.avg*FPS_TO_MPS):fmtInt(st.avg)) : "—"}</b><em>Average</em></div>
              <div class="stat"><b class="num">${shots.length ? (state.units.velocity==="mps"?fmt1(st.es*FPS_TO_MPS):fmtInt(st.es)) : "—"}</b><em>ES</em></div>

        <div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.avg*FPS_TO_MPS):fmtInt(st.avg)}</b><em>Average</em></div>
        <div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.es*FPS_TO_MPS):fmtInt(st.es)}</b><em>ES</em></div>
        <div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.sd*FPS_TO_MPS):fmtInt(st.sd)}</b><em>SD</em></div>
      </div>
      ${rows}
    </div>${nav()}`;
  }

  function renderLoads() {
    const html = state.loads.map(l => {
      const linked = state.strings.filter(s => s.loadId === l.id);
      const allShots = linked.flatMap(s => s.shots);
      const st = statsOf(allShots);
      const avg = allShots.length ? velParts(st.avg) : null;
      const active = l.id === state.activeLoadId;
      return `<button type="button" class="row" data-go="loads" data-param="edit/${l.id}">
        <div class="row-top"><h3>${escape(l.name)}${active ? `<span class="tag">Active</span>` : ""}</h3><b class="num">${massParts(l.grain)}</b></div>
        <div class="row-sub">${escape(l.cartridge)}<br>${escape(l.bullet)}</div>
        <div class="row-stats"><div>${escape(l.powder)} <span class="num">${fmt1(l.charge)} gr</span></div>${avg ? `<div>Avg <span class="num">${avg.big} ${avg.unit}</span></div>` : `<div>No shots yet</div>`}<div>n <span class="num">${allShots.length}</span></div></div>
      </button>`;
    }).join("");
    return `${header("Reload log", sampleChip())}<div class="content has-fab" id="main">${html}</div>
      <div class="fab-wrap"><button class="fab" type="button" data-go="loads" data-param="new">Add load</button></div>${nav()}`;
  }

  function blankForm() {
    return { id: null, name: "", cartridge: "", bullet: "", grain: "", powder: "", charge: "", primer: "", coalIn: "", notes: "", makeActive: true };
  }

  function formFromLoad(l) {
    return { id: l.id, name: l.name, cartridge: l.cartridge, bullet: l.bullet, grain: l.grain, powder: l.powder, charge: l.charge, primer: l.primer, coalIn: l.coalIn, notes: l.notes, makeActive: l.id === state.activeLoadId };
  }

  function renderLoadForm() {
    if (!state.form) {
      state.form = state.param && state.param !== "new" && loadById(state.param) ? formFromLoad(loadById(state.param)) : blankForm();
    }
    const f = state.form;
    const isNew = !f.id;
    const linked = f.id ? state.strings.filter(s => s.loadId === f.id) : [];
    const shots = linked.flatMap(s => s.shots);
    const st = statsOf(shots);
    const coalUnit = state.units.length === "mm" ? "mm" : "in";
    const massUnit = state.units.mass === "g" ? "g" : "gr";
    const coalValue = (f.coalIn === "" || f.coalIn == null || !isFinite(f.coalIn))
      ? ""
      : (state.units.length === "mm" ? (f.coalIn * 25.4).toFixed(2) : f.coalIn.toFixed(3));
    const massValue = (f.grain === "" || f.grain == null || !isFinite(f.grain))
      ? ""
      : (state.units.mass === "g" ? (f.grain * 0.06479891).toFixed(2) : String(f.grain));
    const linkedHtml = shots.length ? `<div class="block"><h2>Linked velocities</h2><p class="help">${shots.length} sample shots across ${linked.length} string${linked.length===1?"":"s"}.</p>
      <div class="stats"><div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.avg*FPS_TO_MPS):fmtInt(st.avg)}</b><em>Average</em></div>
      <div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.es*FPS_TO_MPS):fmtInt(st.es)}</b><em>ES</em></div>
      <div class="stat"><b class="num">${state.units.velocity==="mps"?fmt1(st.sd*FPS_TO_MPS):fmtInt(st.sd)}</b><em>SD</em></div></div>
      <p class="note">${linked.map(s => escape(s.title) + " (" + s.shots.length + ")").join(" · ")}</p></div>` : `<div class="block"><h2>Linked velocities</h2><p class="help">No shots tied to this load yet. After you shoot, they land here.</p></div>`;

    return `${header(isNew ? "Add load" : "Edit load")}<div class="content" id="main">
      <button type="button" class="back" data-go="loads">← Loads</button>
      <p style="margin-bottom:12px">${sampleChip()}</p>
      <p class="kicker" style="margin-bottom:14px">Saved loads stay on the phone. Mark one active to use it on Live shot.</p>
      <form id="load-form" class="form-grid" autocomplete="off">
        <label class="field span-2"><span>Nickname</span><input name="name" maxlength="40" required value="${escape(f.name)}" placeholder="e.g. Hill 168"></label>
        <label class="field"><span>Cartridge</span><input name="cartridge" required value="${escape(f.cartridge)}" placeholder="e.g. .308 Winchester"></label>
        <label class="field"><span>Bullet</span><input name="bullet" required value="${escape(f.bullet)}" placeholder="e.g. Sierra MatchKing HPBT"></label>
        <label class="field"><span>Bullet weight (${massUnit})</span><input name="grain" type="number" inputmode="decimal" step="0.1" min="1" required value="${escape(massValue)}" placeholder="168"></label>
        <label class="field"><span>Charge (gr)</span><input name="charge" type="number" inputmode="decimal" step="0.1" min="0" required value="${escape(f.charge)}" placeholder="43.5"></label>
        <label class="field"><span>Powder</span><input name="powder" required value="${escape(f.powder)}" placeholder="e.g. Varget"></label>
        <label class="field"><span>Primer</span><input name="primer" value="${escape(f.primer)}" placeholder="e.g. CCI BR2"></label>
        <label class="field span-2"><span>COAL (${coalUnit})</span><input name="coal" type="number" inputmode="decimal" step="0.01" min="0" value="${escape(coalValue)}" placeholder="${state.units.length === "mm" ? "71.12" : "2.800"}"></label>
        <label class="field span-2"><span>Notes</span><textarea name="notes" placeholder="Zero, barrel, weather, pressure signs">${escape(f.notes)}</textarea></label>
        <label class="check span-2"><input type="checkbox" name="makeActive" ${f.makeActive?"checked":""}> Make this the active load</label>
        <div class="form-actions span-2">
          <button type="button" class="ghost" data-go="loads">Cancel</button>
          <button type="submit" class="primary">Save load</button>
        </div>
      </form>
      ${isNew ? "" : linkedHtml}
    </div>${nav()}`;
  }

  function tubeSvg() {
    return `<svg class="tube" viewBox="0 0 320 86" aria-hidden="true">
      <rect x="8" y="28" width="210" height="30" rx="6" fill="#2A332C" stroke="#3A463E" stroke-width="2"/>
      <text x="112" y="48" text-anchor="middle" fill="#7B8476" font-size="11" font-family="Segoe UI, sans-serif" letter-spacing="1.2">BLACK-BOX TUBE</text>
      <rect x="218" y="20" width="94" height="46" rx="8" fill="#141816" stroke="#F0B429" stroke-width="2"/>
      <text x="265" y="40" text-anchor="middle" fill="#7A846C" font-size="8" font-family="Segoe UI, sans-serif" letter-spacing="1">FIELD LINK</text>
      <text x="265" y="58" text-anchor="middle" fill="#F0B429" font-size="16" font-weight="700" font-family="Segoe UI, sans-serif">${state.connected && currentString() && currentString().shots.length ? Math.round(currentString().shots[currentString().shots.length-1].fps) : "—"}</text>
    </svg>`;
  }

  function renderConnect() {
    const stClass = state.scanning ? "scan" : state.connected ? "ok" : "off";
    const stText = state.scanning ? "Searching…" : state.connected ? "Connected" : "Not connected";
    const action = state.scanning
      ? `<button class="ghost" type="button" disabled>Searching for FL-1048…</button>`
      : state.connected
        ? `<button class="danger-btn" type="button" data-act="disconnect">Disconnect</button>`
        : `<button class="primary" type="button" data-act="pair">Search for module</button>`;
    return `${header("Connect", sampleChip())}<div class="content" id="main">
      <div class="connect-wrap">
        <div class="device">
          ${tubeSvg()}
          <div class="conn-state ${stClass}">${stText}</div>
          <p class="hint" style="margin-top:8px">FieldLink Module · ${escape(state.serial)}</p>
        </div>
        <div class="kv">
          <div><b class="num">${state.connected ? state.battery + "%" : "—"}</b><em>Battery</em></div>
          <div><b>${state.connected ? "BLE 5" : "—"}</b><em>Link</em></div>
          <div><b class="num">${escape(state.firmware)}</b><em>Firmware</em></div>
          <div><b>${state.connected ? "On rifle" : "Last: range"}</b><em>Status</em></div>
        </div>
        ${action}
        <p class="hint">Pair over Bluetooth. A tablet can also join on Wi-Fi once the module is up. This preview uses sample data and does not talk to real hardware.</p>
      </div>
    </div>${nav()}`;
  }

  function renderSettings() {
    const u = state.units;
    const seg = (key, a, al, b, bl) =>
      `<div class="seg two" role="radiogroup">
        <button type="button" role="radio" data-unit="${key}" data-val="${a}" aria-selected="${u[key]===a}">${al}</button>
        <button type="button" role="radio" data-unit="${key}" data-val="${b}" aria-selected="${u[key]===b}">${bl}</button>
      </div>`;
    return `${header("Settings")}<div class="content" id="main">
      <div class="block">
        <h2>Units</h2>
        <p class="help">The big number on Live shot follows velocity. Energy uses the active load’s bullet weight.</p>
        <p class="kicker" style="margin-bottom:8px">Velocity</p>
        ${seg("velocity","fps","fps","mps","m/s")}
        <p class="kicker" style="margin-bottom:8px">Energy</p>
        ${seg("energy","ftlbf","ft·lbf","j","Joules")}
        <p class="kicker" style="margin-bottom:8px">Bullet weight</p>
        ${seg("mass","gr","grains","g","grams")}
        <p class="kicker" style="margin-bottom:8px">Length (coil and COAL)</p>
        ${seg("length","mm","mm","in","inches")}
      </div>
      <div class="block">
        <h2>Coil spacing</h2>
        <p class="help">Measure center-to-center of the two coils on the module sleeve. Velocity is spacing divided by flight time, so a 1% error in this number is a 1% error in every speed.</p>
        <div class="stepper">
          <button type="button" data-act="coil" data-delta="-0.1" aria-label="Decrease spacing">−</button>
          <div class="val num">${coilDisplay()}</div>
          <button type="button" data-act="coil" data-delta="0.1" aria-label="Increase spacing">+</button>
        </div>
        <p class="note">Stored internally as ${fmt1(state.coilMm)} mm. Default for this sample module is 50.0 mm.</p>
      </div>
      <div class="block">
        <h2>Module</h2>
        <div class="kv">
          <div><b>${escape(state.serial)}</b><em>Serial</em></div>
          <div><b class="num">${escape(state.firmware)}</b><em>Firmware</em></div>
        </div>
        <p class="note">All shots and loads in this prototype are sample data. Nothing here is a measured string from a real rifle.</p>
      </div>
    </div>${nav()}`;
  }

  function render() {
    let html = statusBar();
    if (state.route === "connect") html += renderConnect();
    else if (state.route === "history") html += renderHistory();
    else if (state.route === "string") html += renderString();
    else if (state.route === "loads") html += renderLoads();
    else if (state.route === "load-form") html += renderLoadForm();
    else if (state.route === "settings") html += renderSettings();
    else html += renderLive();
    $app.innerHTML = html;
    const form = document.getElementById("load-form");
    if (form) form.addEventListener("submit", onSaveLoad);
  }

  function simulateShot() {
    const load = activeLoad();
    let str = currentString();
    if (!str || str.loadId !== state.activeLoadId || str.dateISO !== "2026-11-24") {
      str = { id: "s" + (state.strings.length + 8), loadId: state.activeLoadId, title: "Live string", dateISO: "2026-11-24", shots: [] };
      state.strings.unshift(str);
      state.currentStringId = str.id;
    }
    const base = load && load.expectedFps ? load.expectedFps : 2640;
    const fps = Math.round(Math.max(800, base + gaussian() * 14));
    const next = makeShot(load, fps);
    cancelPlayback();
    state.chart = "trigger";
    state.playback = { t: AIM_T0, running: true, revealScore: false, revealVelocity: false, shot: next, committed: false };
    if (state.route !== "live") go("live");
    else render();
    const hero = document.getElementById("hero");
    if (hero) {
      const meta = hero.querySelector(".shot-meta");
      const vel = hero.querySelector(".vel");
      const alt = hero.querySelector(".hero-alt");
      if (meta) meta.textContent = "Watch the hold";
      if (vel) vel.innerHTML = '—<span class="vel-unit">' + (state.units.velocity === "mps" ? "m/s" : "fps") + "</span>";
      if (alt) alt.textContent = "Sample hold  ·  breath, then press";
    }
    const fab = document.querySelector(".fab");
    if (fab) fab.textContent = "Playing…";
    const gen = playbackGen;
    const t0 = performance.now();
    function tick(now) {
      if (gen !== playbackGen) return;
      const wall = now - t0;
      const t = dataTimeFromWall(wall);
      state.playback.t = t;
      if (t >= 0 && !state.playback.committed) {
        state.playback.committed = true;
        state.playback.revealVelocity = true;
        str.shots.push(next);
        if (str.shots.length > 20) str.shots.shift();
        state.selectedShot = str.shots.length - 1;
        const vp = velParts(next.fps);
        const en = load ? energyParts(next.fps, load.grain) : null;
        if (hero) {
          const meta = hero.querySelector(".shot-meta");
          const vel = hero.querySelector(".vel");
          const alt = hero.querySelector(".hero-alt");
          if (meta) meta.textContent = "Shot " + str.shots.length + " of " + str.shots.length;
          if (vel) vel.innerHTML = vp.big + '<span class="vel-unit">' + vp.unit + "</span>";
          if (alt) alt.innerHTML = vp.alt + (en ? "<span>·</span>" + en : "");
          hero.classList.remove("flash");
          void hero.offsetWidth;
          hero.classList.add("flash");
        }
      }
      if (t >= AIM_T1) {
        state.playback.t = AIM_T1;
        state.playback.running = false;
        state.playback.revealScore = true;
        paintScope(next, state.playback);
        const note = document.querySelector("#scope-summary + .note");
        if (!note) {
          const box = document.getElementById("scope-summary");
          if (box && box.parentNode) {
            const p = document.createElement("p");
            p.className = "note";
            p.style.marginTop = "6px";
            p.style.textAlign = "center";
            p.textContent = next.aim.breakMoveMm.toFixed(0) + " mm at 100 m  ·  sample data";
            box.insertAdjacentElement("afterend", p);
          }
        }
        if (fab) fab.textContent = "Simulate shot";
        playbackTimer = 0;
        return;
      }
      paintScope(next, state.playback);
      playbackTimer = requestAnimationFrame(tick);
    }
    playbackTimer = requestAnimationFrame(tick);
  }

  function onSaveLoad(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get("name") || "").trim();
    const cartridge = String(fd.get("cartridge") || "").trim();
    const bullet = String(fd.get("bullet") || "").trim();
    const powder = String(fd.get("powder") || "").trim();
    const primer = String(fd.get("primer") || "").trim();
    const notes = String(fd.get("notes") || "").trim();
    let grain = parseFloat(fd.get("grain"));
    if (state.units.mass === "g") grain = grain / 0.06479891;
    const charge = parseFloat(fd.get("charge"));
    let coalIn = parseFloat(fd.get("coal"));
    if (!isFinite(coalIn)) coalIn = 0;
    if (state.units.length === "mm") coalIn = coalIn / 25.4;
    const makeActive = fd.get("makeActive") === "on";
    if (!name || !cartridge || !bullet || !isFinite(grain)) return;
    if (state.form && state.form.id) {
      const l = loadById(state.form.id);
      Object.assign(l, { name, cartridge, bullet, grain: +grain.toFixed(2), powder, charge, primer, coalIn: +coalIn.toFixed(4), notes });
      if (makeActive) state.activeLoadId = l.id;
    } else {
      const id = "l" + (Date.now() % 100000);
      state.loads.push({ id, name, cartridge, bullet, grain: +grain.toFixed(2), powder, charge, primer, coalIn: +coalIn.toFixed(4), notes, expectedFps: 2600 });
      if (makeActive) state.activeLoadId = id;
    }
    state.form = null;
    go("loads");
  }

  function pair() {
    state.scanning = true;
    render();
    setTimeout(() => { state.scanning = false; state.connected = true; if (state.route === "connect") render(); }, 1200);
  }

  $app.addEventListener("click", (e) => {
    const goBtn = e.target.closest("[data-go]");
    if (goBtn) {
      const r = goBtn.getAttribute("data-go");
      const p = goBtn.getAttribute("data-param");
      state.form = null;
      state.selectedShot = -1;
      cancelPlayback();
      state.playback = null;
      go(r, p);
      return;
    }
    const shot = e.target.closest("[data-shot]");
    if (shot) { cancelPlayback(); state.playback = null; state.selectedShot = +shot.getAttribute("data-shot"); render(); return; }
    const tab = e.target.closest("[data-chart]");
    if (tab) { cancelPlayback(); state.playback = null; state.chart = tab.getAttribute("data-chart"); render(); return; }
    const unit = e.target.closest("[data-unit]");
    if (unit) { state.units[unit.getAttribute("data-unit")] = unit.getAttribute("data-val"); render(); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const a = act.getAttribute("data-act");
    if (a === "simulate") simulateShot();
    else if (a === "pair") pair();
    else if (a === "disconnect") { state.connected = false; render(); }
    else if (a === "coil") {
      const d = parseFloat(act.getAttribute("data-delta"));
      state.coilMm = Math.max(20, Math.min(120, +(state.coilMm + d).toFixed(1)));
      render();
    }
  });

  window.addEventListener("hashchange", () => { state.form = null; parseHash(); render(); });

  window.FieldLink = {
    state,
    go: (r, p) => { state.form = null; go(r, p); },
    simulate: simulateShot,
    setClock: (t) => { state.clock = t; },
    prepare: function (screen) {
      state.clock = "16:04";
      state.connected = true;
      state.scanning = false;
      state.selectedShot = -1;
      state.chart = "trigger";
      state.form = null;
      cancelPlayback();
      state.playback = null;
      if (screen === "live") go("live");
      else if (screen === "history") go("history");
      else if (screen === "loads") go("loads");
      else if (screen === "add-load") { state.form = blankForm(); go("loads", "new"); }
      else if (screen === "connect") go("connect");
      else if (screen === "settings") go("settings");
      else if (screen === "scope-green") {
        go("live");
        state.chart = "trigger";
        state.playback = { t: -260, running: false, revealScore: false, revealVelocity: true };
        render();
      } else if (screen === "scope-break") {
        go("live");
        state.chart = "trigger";
        state.playback = { t: 90, running: false, revealScore: true, revealVelocity: true };
        render();
      }
    },
    freezeScope: function (t, opts) {
      cancelPlayback();
      state.chart = "trigger";
      state.playback = { t: t, running: false, revealScore: !!(opts && opts.score), revealVelocity: true };
      if (state.route !== "live") go("live");
      else render();
    }
  };

  parseHash();
  if (!location.hash) go("live");
  else render();
})();
  </script>
</body>
</html>
